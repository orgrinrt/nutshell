# =============================================================================
# nutshell QA Configuration - Tough
# =============================================================================
# Part of nutshell - Everything you need, in a nutshell.
# https://github.com/orgrinrt/nutshell
#
# The tough template. Every gate on, every threshold at the tightest value the
# checks offer.
#
# What that means in practice: a file over 300 lines of code fails, a public
# function without a `Usage:` line fails, two functions whose names score above
# 0.85 similar fail, and a `TODO` is a finding rather than a note.
#
# Pick it when a failing gate is what you want from a gate. The default
# template is the same checks at values a codebase can adopt without a week of
# work first.
#
# For gentler defaults, see: examples/configs/default.nut.toml
# For all options documented: examples/configs/empty.nut.toml
# =============================================================================

# -----------------------------------------------------------------------------
# What this package is
# -----------------------------------------------------------------------------
# Its own section, because `[meta]` is about this file and this is about the
# thing the file describes. A review read `[meta] version` as nutshell's twice,
# and it is the schema's.
#
# The fields are the ones cargo, npm and deno all agree on, because a package
# manifest that invents its own vocabulary makes every reader learn it: name,
# version, description, license, repository, keywords. `[lib]` and `[bin]` are
# cargo's shape, and `[bin]` is a map the way package.json's is.

[package]
name = "nutshell"
version = "0.7.0"
description = "A bash library: modules with a manifest, a QA gate, and dependency resolution."
license = "MPL-2.0"
repository = "https://github.com/orgrinrt/nutshell"
keywords = ["bash", "shell", "posix", "library", "modules"]

# -----------------------------------------------------------------------------
# Feature flags, the way cargo has them
# -----------------------------------------------------------------------------
#
# A gate asks about the machine: which shell is running, whether a binary is on
# PATH. A feature is a choice, and the difference matters when the answer is
# being written into a file that runs somewhere else. Lowering on a machine
# with bash takes the bash half of every `#[shell(bash4)]` pair, because that
# gate asks the running shell and gets the right answer; selecting features is
# how you ask for the other half anyway.
#
# The rules are cargo's. Enabling a feature only ever adds. `default` is a set
# like any other and `NUT_NO_DEFAULT_FEATURES=1` drops it. `NUT_FEATURES` adds
# to whatever is left. A row in `lib.nut` with no `#[feature(...)]` is always
# in, so a manifest that declares none behaves as it did before this existed.
#
#   [features]
#   default = ["bash"]
#   bash    = []
#
# A feature's list names other features it turns on, which is the one part of
# the model that is more than a set.
[features]
# The bash halves of the paired modules: `map`, `list`, `string` and the
# prompt. On by default, because the machine this is developed on has bash and
# the bash halves are faster where they run.
#
# `nut-lower --no-default-features` drops them, which is how a lowering made
# here produces a file for a machine that has only a POSIX shell.
default = ["bash"]
bash = []

# The library entry point: the file that says what this package provides, the
# way `src/lib.rs` does for a crate.
[lib]
path = "lib.nut"

# Command name to the file behind it.
[bin]
nutshell = "bin/nutshell"

[meta]
# The schema's version, not this package's. That is `[package] version` above.
version = "1.0.0"
name = "nutshell"
description = "A bash library: modules with a manifest, a QA gate, and dependency resolution."

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
[paths]
lib_dir = "lib"
exclude = [".git", ".legacy", "node_modules", "vendor", "target", "dist", "build", "templates", "/impl/", "impl/"]
# The extensionless entry points count too. `bin/nutshell` is the interpreter
# and `init` is the bootstrap, and an `include` of `*.sh` alone means the two
# files most worth checking are the two the checks cannot see. A change adding
# public functions to `init` passed `public_api_docs` by being invisible to it.
include = ["*.sh", "init", "test", "check", "bin/nutshell"]

# -----------------------------------------------------------------------------
# Annotations - Semantic markers that explain WHY exceptions exist
# -----------------------------------------------------------------------------
[annotations]
# Public API - intentional interface, must be documented
public_api = "#[pub]"

# Trivial wrapper kept for API ergonomics/consistency
allow_trivial_wrapper_ergonomics = "#[allow(trivial_wrapper)]"

# File exceeds normal size limit with explicit justification
allow_large_file = "#\\[allow\\(loc = ([0-9]+)\\)\\]"

# -----------------------------------------------------------------------------
# Tests Configuration
# -----------------------------------------------------------------------------
# Each test can be:
#   - false (disabled)
#   - true (enabled with defaults)
#   - a table with settings (enabled with custom config)
#
# Note: When using a table, don't also set the boolean - TOML doesn't allow that.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Syntax Validation
# -----------------------------------------------------------------------------
[tests.syntax]
shell = "bash"
fail_on_error = true

# -----------------------------------------------------------------------------
# Trivial Wrappers
# -----------------------------------------------------------------------------
[tests.trivial_wrappers]
# 1-2 line functions are suspicious
max_lines = 2

# Must be used at least 4 times locally to justify existence
local_usage_threshold = 4

# Or 6 times globally across the codebase
global_usage_threshold = 6

# Using 2+ variables provides ergonomic value
min_vars_for_ergonomic = 2

# Paths/patterns to exclude from trivial wrapper analysis
# The impl directories contain intentional function replacements
exclude_patterns = [
    "*/impl/*",
]

# Token complexity thresholds
token_complexity_warn = 3
token_complexity_pass = 4

# Zero tolerance - warn on first, fail on many
warn_threshold = 5
fail_threshold = 20

# Only these explicit annotations can exempt a function
exempt_annotations = [
    "#[pub]",
    "#[allow(trivial_wrapper)]",
]

# -----------------------------------------------------------------------------
# File Size
# -----------------------------------------------------------------------------
[tests.file_size]
# 300 lines of actual code max - forces decomposition
max_loc = 300

# 500 total lines including docs - keeps files reviewable
max_total_lines = 500

# Per-file exemption requires explicit annotation with justification
exempt_annotation_pattern = "#\\[allow\\(loc = ([0-9]+)\\)\\]"

# Files matching these patterns are exempt from size limits
# deps.sh is large due to comprehensive tool detection
exempt_patterns = []

# -----------------------------------------------------------------------------
# Function Duplication
# -----------------------------------------------------------------------------
[tests.function_duplication]
# 85% similar = probably copy-pasted
similarity_threshold = 0.85

# Check functions with 3+ lines
min_lines_to_check = 3

# Ignore functions with these name patterns (regex)
# The impl files intentionally define the same function names as stubs
ignore_name_patterns = []

# Paths/patterns to exclude from duplication analysis
# The impl directories contain intentional function replacements (stubs pattern)
exclude_patterns = [
    "*/impl/*",
]

# -----------------------------------------------------------------------------
# Cruft Detection
# -----------------------------------------------------------------------------
[tests.cruft]
# Debug code patterns - these should NEVER be committed
# Note: Patterns are case-sensitive and use grep -E regex
# Be careful not to match legitimate code comments
debug_patterns = [
    "echo.*DEBUG",
    "echo.*TODO",
    "echo.*FIXME",
    "echo.*XXX",
    "^[[:space:]]*set -x",
    "^[[:space:]]*PS4=",
    "BASH_XTRACEFD",
    "# DEBUG:",
    "# DEBUG$",
    "# TEMP:",
    "# TEMP$",
    "# TEMPORARY:",
    "# TEMPORARY$",
    "# REMOVE THIS",
    "# DELETE THIS",
    "# REMOVE BEFORE",
    "# DELETE BEFORE",
]

# TODO patterns - tracked but limited
todo_patterns = [
    "TODO:",
    "TODO\\(",
    "FIXME:",
    "FIXME\\(",
    "XXX:",
    "XXX\\(",
    "HACK:",
    "HACK\\(",
    "BUG:",
    "BUG\\(",
    "BROKEN:",
    "REFACTOR:",
]

# Debug code = instant fail
fail_on_debug = true

# TODOs are warnings, but we limit them
fail_on_todo = false

# Max 10 TODOs per repo - forces resolution
max_todos = 10

# -----------------------------------------------------------------------------
# Public API Documentation
# -----------------------------------------------------------------------------
[tests.public_api_docs]
# This annotation marks functions as public API
public_api_annotation = "#[pub]"

# Required: must have a usage example
required_elements = [
    "Usage:",
]

# Recommended: should describe return value
recommended_elements = [
    "->",
    "Returns",
    "returns",
    "Prints",
    "prints",
]

# At least 1 line of documentation
min_doc_lines = 1

# -----------------------------------------------------------------------------
# Output - Clear, actionable
# -----------------------------------------------------------------------------
[output]
color = "auto"
verbosity = "normal"
format = "human"

# Don't show passing tests - focus on what needs fixing
show_passing = false

# Always show summary
show_summary = true

# -----------------------------------------------------------------------------
# External libraries
# -----------------------------------------------------------------------------
# Name to source, resolved once into a shared cache and reused by everything
# that names the same ref. Git is first-class because that is where these
# actually live; a released tarball is a later concern.
#
#   [deps.<name>]
#   git = "<url>"
#   ref = "<branch, tag or sha>"    # optional, defaults to the default branch
#
# A module inside one is reached by namespacing the use:
#
#   use shebang::diagnostics/findings
#
# The bare form stays nutshell's own, because nutshell is the default and
# prefixing the common path to disambiguate the rare one is friction on every
# line to help a few.

[deps.shebang]
git = "https://github.com/orgrinrt/the-whole-shebang.git"
ref = "main"

# How much of this library a POSIX shell can read.
#
# The floor is meant to be POSIX sh, with a `when=` row selecting a better file
# where a tool or a modern shell earns it. That is a direction rather than a
# state, so this reports a number rather than passing or failing: 31 of 40 at
# the time it was first measured, which is the honest starting point.
#
# `max_unreadable` is the budget. Left at -1 it reports and never blocks, which
# is right while the number is still large, because a gate that fails every run
# is one people stop reading. Lower it as the number comes down and it becomes
# a ratchet.
[tests.posix_floor]
enabled = true
max_unreadable = -1
exempt = []
